<script src="../panel.js?v=1786906781" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    Panel.init({ activo: "ventas", buscar: "Buscar por comprador, mail o dorsal" });

    try {
      var VENTAS = [
        { q: "Martina Fernández", m: "martina.fdez@gmail.com",   ev: "Duatlón Chivilcoy",    f: 4, t: 6, bruto: 7200,  st: "ok",   d: 2 },
        { q: "Juan Pablo Ríos",   m: "jprios88@gmail.com",       ev: "Duatlón Chivilcoy",    f: 2, t: 21, bruto: 3600, st: "ok",   d: 1 },
        { q: "Lucía Cabrera",     m: "luciacabrera@hotmail.com", ev: "Duatlón Chivilcoy",    f: 9, t: 48, bruto: 14400, st: "ok",  d: 3 },
        { q: "Emiliano Duarte",   m: "emi.duarte@gmail.com",     ev: "Media Maratón",        f: 3, t: 122, bruto: 5400, st: "ok",  d: 0 },
        { q: "Sofía Vega",        m: "sofivega@gmail.com",       ev: "Duatlón Chivilcoy",    f: 5, t: 184, bruto: 9000, st: "ok",  d: 1 },
        { q: "Nicolás Ferrari",   m: "nferrari@outlook.com",     ev: "Copa Ciudad · Hockey", f: 7, t: 260, bruto: 11200, st: "pend", d: 0 },
        { q: "Camila Ponce",      m: "cami.ponce@gmail.com",     ev: "Media Maratón",        f: 1, t: 340, bruto: 1800, st: "ok",  d: 1 },
        { q: "Federico Ledesma",  m: "fledesma@gmail.com",       ev: "Torneo Apertura",      f: 6, t: 420, bruto: 10800, st: "ok", d: 4 },
        { q: "Ana Paula Sosa",    m: "anapau.sosa@gmail.com",    ev: "Copa Ciudad · Hockey", f: 2, t: 505, bruto: 3600, st: "dev", d: 0 },
        { q: "Matías Bustos",     m: "matibustos@gmail.com",     ev: "Duatlón Chivilcoy",    f: 12, t: 610, bruto: 19200, st: "ok", d: 5 }
      ];

      var ESTADO = {
        ok:   { txt: "Acreditada",  cls: "" },
        pend: { txt: "Pendiente",   cls: "draft" },
        dev:  { txt: "Reembolsada", cls: "bad" }
      };

      function pesos(n) { return "$" + n.toLocaleString("es-AR"); }
      function iniciales(s) {
        return s.split(" ").slice(0, 2).map(function (p) { return p[0]; }).join("").toUpperCase();
      }
      function hace(min) {
        if (min < 60) return "hace " + min + " min";
        if (min < 1440) return "hace " + Math.round(min / 60) + " h";
        return "hace " + Math.round(min / 1440) + " d";
      }
      /* Neto en el listado, no bruto. El fotógrafo compara contra lo que va a
         cobrar; mostrarle el precio de lista lo obliga a hacer la cuenta. */
      function neto(v) { return Math.round(v.bruto * 0.95); }

      var filas = document.getElementById("filas");

      function pintar(lista) {
        filas.innerHTML = lista.map(function (v, i) {
          var e = ESTADO[v.st];
          return '<div class="row vt" data-i="' + i + '" role="button" tabindex="0">' +
            '<span class="v-av">' + iniciales(v.q) + "</span>" +
            '<span class="v-who"><b>' + v.q + "</b><span>" + v.m + "</span></span>" +
            '<span class="v-ev c-ev">' + v.ev + "</span>" +
            '<span class="num soft c-fotos">' + v.f + "</span>" +
            '<span class="num soft c-fecha">' + hace(v.t) + "</span>" +
            '<span class="num tnum neto">' + pesos(neto(v)) + "</span>" +
            '<span class="pill ' + e.cls + ' c-estado"><i></i> ' + e.txt + "</span>" +
            "</div>";
        }).join("");
      }

      pintar(VENTAS);

      /* Orden. Un solo criterio activo por vez y la flecha sólo en la columna
         que manda: seis flechas a la vez no dicen por cuál está ordenado. */
      var CAMPO = { quien: "q", evento: "ev", fotos: "f", fecha: "t", monto: "bruto" };
      document.querySelectorAll(".th").forEach(function (th) {
        th.addEventListener("click", function () {
          var asc = th.dataset.ord !== "asc";
          document.querySelectorAll(".th").forEach(function (o) { delete o.dataset.ord; });
          th.dataset.ord = asc ? "asc" : "desc";
          var k = CAMPO[th.dataset.c];
          var copia = VENTAS.slice().sort(function (a, b) {
            var x = a[k], y = b[k];
            if (typeof x === "string") return asc ? x.localeCompare(y, "es") : y.localeCompare(x, "es");
            return asc ? x - y : y - x;
          });
          pintar(copia);
          VISTA = copia;
        });
      });

      /* ── Cajón ── */
      var VISTA = VENTAS;
      var raiz = document.documentElement;
      function abrir(v) {
        document.getElementById("d-quien").textContent = v.q;
        document.getElementById("d-mail").textContent = v.m;
        document.getElementById("d-neto").textContent = pesos(neto(v));
        document.getElementById("d-ev").textContent = v.ev;
        document.getElementById("d-fecha").textContent = hace(v.t);
        document.getElementById("d-estado").textContent = ESTADO[v.st].txt;
        document.getElementById("d-desc").textContent =
          v.d === 0 ? "Todavía no descargó" : v.d + (v.d === 1 ? " descarga" : " descargas");
        document.getElementById("d-vence").textContent = "en 27 días";

        var n = Math.min(v.f, 4);
        var html = "";
        for (var i = 0; i < n; i++) html += '<div class="mini"></div>';
        if (v.f > 4) html += '<div class="mini mas">+' + (v.f - 4) + "</div>";
        document.getElementById("d-minis").innerHTML = html;

        raiz.dataset.venta = "open";
      }
      function cerrar() { raiz.dataset.venta = ""; }

      filas.addEventListener("click", function (ev) {
        var f = ev.target.closest(".row");
        if (f) abrir(VISTA[+f.dataset.i]);
      });
      filas.addEventListener("keydown", function (ev) {
        if (ev.key !== "Enter" && ev.key !== " ") return;
        var f = ev.target.closest(".row");
        if (f) { ev.preventDefault(); abrir(VISTA[+f.dataset.i]); }
      });
      document.getElementById("d-cerrar").addEventListener("click", cerrar);
      document.getElementById("dscrim").addEventListener("click", cerrar);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrar(); });

      document.getElementById("rango").addEventListener("click", function (ev) {
        var b = ev.target.closest("button");
        if (!b) return;
        this.querySelectorAll("button").forEach(function (x) { x.removeAttribute("aria-pressed"); });
        b.setAttribute("aria-pressed", "true");
      });
    } catch (e) { console.warn("ventas:", e); }
  });
</script>
